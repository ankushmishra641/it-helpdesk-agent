services:
  - type: web
    name: northstar-it-helpdesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 40 --timeout-keep-alive 5
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: GROQ_API_KEY
        value: ""
      - key: DAILY_LLM_LIMIT
        value: 100
      - key: MAX_DAILY_SESSIONS
        value: 50
